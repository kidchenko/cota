[package]
name         = "cota"
version      = "0.0.1"
edition      = "2021"
rust-version = "1.77"
description  = "Your Claude usage limits, in the Windows tray"
authors      = ["kidchenko <kidchenko@gmail.com>"]
license      = "MIT"
repository   = "https://github.com/kidchenko/cota"

[[bin]]
name = "cota"
path = "src/main.rs"

[dependencies]
muda       = "0.19"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tao        = "0.37"
tray-icon  = "0.24"
# Blocking. Picked over reqwest because this app makes one GET a minute and a
# Tokio runtime would cost more binary than the feature.
#
# Deliberately schannel rather than the default bundled-rustls: on a managed
# work machine the TLS is often intercepted by the corporate proxy, and only
# the Windows certificate store knows about that root. Bundled webpki roots
# would hard-fail there with an opaque handshake error. `win-system-proxy` is
# the other half of the same problem.
ureq = { version = "3.4", default-features = false, features = [
    "native-tls",
    "win-system-proxy",
    "gzip",
] }
tauri-winrt-notification = "0.8"

[dependencies.windows]
version  = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

# Size is a first-class goal, same as Cantos.
[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true
